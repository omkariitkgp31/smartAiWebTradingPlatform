services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend-main
      dockerfile: Dockerfile
    container_name: smart_ai_backend
    env_file:
      - ./Backend-main/.env
    environment:
      # Override the DB_HOST to point to the postgres service container
      DB_HOST: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend-V0
      dockerfile: Dockerfile
      args:
        # Pass the local backend URL for build time if necessary
        NEXT_PUBLIC_API_URL: http://localhost:8080
    container_name: smart_ai_frontend
    environment:
      # In Next.js client-side, the browser will still resolve localhost
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
